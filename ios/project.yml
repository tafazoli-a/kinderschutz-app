# Xcode-Projekt-Beschreibung für XcodeGen (https://github.com/yonaskolb/XcodeGen)
# Auf dem Mac:  brew install xcodegen  &&  cd ios  &&  xcodegen
name: KinderSchutz
options:
  bundleIdPrefix: de.familie
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # hier deine Apple-Team-ID eintragen (Xcode > Settings > Accounts)
    CODE_SIGN_STYLE: Automatic
targets:
  KinderSchutz:
    type: application
    platform: iOS
    sources: [KinderSchutz, Shared]
    info:
      path: KinderSchutz/Info.plist
      properties:
        CFBundleDisplayName: KinderSchutz
        UILaunchScreen: {}
    entitlements:
      path: KinderSchutz/KinderSchutz.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.de.familie.kinderschutz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.familie.kinderschutz
    dependencies:
      - target: Monitor
  Monitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: KinderSchutz Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.de.familie.kinderschutz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.familie.kinderschutz.monitor
