# Baut die Android-App (APK) in der GitHub-Cloud und stellt sie als "Test-Version" zum Download bereit.
name: Android bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK bauen
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KinderSchutz-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Test-Version zum Download bereitstellen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KinderSchutz.apk
          gh release delete test --yes --cleanup-tag || true
          gh release create test KinderSchutz.apk --prerelease --target "$GITHUB_SHA" \
            --title "KinderSchutz Test-Version" \
            --notes "Automatisch gebaut aus Stand ${GITHUB_SHA::7}. Nur zum Testen."
